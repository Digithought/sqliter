# The repo's test scripts invoke `node_modules/mocha/bin/mocha.js` by path and
# register ts-node from the workspace root, neither of which works under Yarn
# PnP — so the linker choice is not cosmetic, it is what makes `yarn test` and
# `yarn lint` run at all.
nodeLinker: node-modules

# langium (pulled in transitively by mermaid -> @mermaid-js/parser) imports
# vscode-jsonrpc, vscode-languageserver-protocol and vscode-languageserver-types
# without declaring them as dependencies (it relies on node_modules hoisting via
# vscode-languageserver). Hoisting covers this today; the extensions are kept so
# the build stays reproducible if the tree is ever installed strictly.
packageExtensions:
  "langium@*":
    dependencies:
      vscode-jsonrpc: "8.2.0"
      vscode-languageserver-protocol: "3.17.5"
      vscode-languageserver-types: "3.17.5"
